# /etc/logrotate.d/abuhafs
#
# Rotates the cron+systemd log files written by the abuhafs pipeline on
# the production server. Apply on the server with:
#
#   sudo cp deploy/logrotate-abuhafs.conf /etc/logrotate.d/abuhafs
#   sudo logrotate -d /etc/logrotate.d/abuhafs   # dry-run (debug)
#   sudo logrotate    /etc/logrotate.d/abuhafs   # force a rotation now
#
# Notes:
# - copytruncate is used because the systemd service holds the log file
#   open and won't reopen on a plain rename.
# - delaycompress keeps the most-recent rotated file uncompressed so a
#   tail/grep "yesterday" workflow stays cheap.

/var/log/abuhafs-*.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    dateext
    dateformat -%Y%m%d
}
